[workspace]
resolver = "3"
members = [
    "crates/rage-core",
    "crates/rage-nnue",
    "crates/rage-search",
    "crates/rage-syzygy",
    "crates/rage-uci",
    "crates/rage-engine",
    "crates/rage-train",
    "crates/rage-test",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.lints.clippy]
all = "deny"
panic = "deny"
todo = "deny"
expect_used = "deny"
unwrap_used = "deny"
undocumented_unsafe_blocks = "deny"

[workspace.lints.rust]
dead_code = "allow"
