name: CI

on:
  push:
    branches: ['*']

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

defaults:
  run:
    # Run every step inside the flake's dev shell (toolchain, just, wasmtime, etc.)
    shell: nix develop --command bash -e {0}

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: cachix/install-nix-action@v31

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('flake.lock', 'rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - run: just fmt --check
      - run: just lint
      - run: just test-long
      - run: just wasm-check
      - run: just wasm-test
