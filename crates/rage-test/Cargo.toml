[package]
name = "rage-test"
version.workspace = true
edition.workspace = true

# Use custom lints for testing tool (less strict than engine crates)
[lints.clippy]
all = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"

[lints.rust]
dead_code = "allow"

[[bin]]
name = "rage-test"
path = "src/main.rs"

[dependencies]
rage-core = { path = "../rage-core" }
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.40", features = ["bundled"] }
ratatui = "0.30"
crossterm = "0.29"
rand = "0.10"
